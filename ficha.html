<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Criar Ficha</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <h1>Criar Personagem</h1>

  <form id="form-personagem">

    <label>Nome:</label>
    <input type="text" id="nome" required>

    <label>Classe:</label>
    <input type="text" id="classe">

    <h2>Atributos</h2>

    <p id="pontos">Pontos restantes: 4</p>

    <label>Força:</label>
    <input type="number" id="forca">

    <label>Intelecto:</label>
    <input type="number" id="intelecto">

    <label>Presença:</label>
    <input type="number" id="presenca">

    <label>Vigor:</label>
    <input type="number" id="vigor">

    <label>Agilidade:</label>
    <input type="number" id="agilidade">

    <button type="submit">Salvar</button>

  </form>

  <script type="module" src="assets/js/ficha.js"></script>
</body>
</html>
